<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkiTov — Coming soon</title>
  <meta name="description" content="AnkiTov is an open, self-hosted spaced repetition system for schools. Something is taking shape here.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #e5f0ea; --ink: #0f221a; --muted: #395247;
      --accent: #24ad60; --accent-dark: #156d3c; --border: #bdd4c8;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
      color: var(--ink); line-height: 1.6; padding: 1.5rem;
      background-color: var(--bg);
      background-image:
        radial-gradient(920px 500px at 18% 0%, rgba(36, 173, 96, 0.28), transparent 65%),
        radial-gradient(860px 480px at 85% 4%, rgba(232, 180, 68, 0.26), transparent 65%),
        radial-gradient(rgba(21, 109, 60, 0.10) 1px, transparent 1.5px),
        linear-gradient(180deg, #dcebe3 0%, #e7f1ec 38%, #e3eee8 100%);
      background-size: auto, auto, 24px 24px, auto;
      background-repeat: no-repeat, no-repeat, repeat, no-repeat;
    }
    .card {
      max-width: 30rem; text-align: center; background: rgba(255,255,255,0.75);
      border: 1px solid var(--border); border-radius: 1rem; padding: 2.5rem 2rem;
      box-shadow: 0 10px 28px -12px rgba(15,34,26,0.12);
    }
    .brand { font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; }
    .brand .t { color: var(--accent-dark); }
    .badge {
      display: inline-block; margin: 0.35rem 0 1.25rem; color: var(--accent-dark);
      background: #d2ecde; border: 1px solid var(--border); font-size: 0.75rem;
      font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.3rem 0.75rem; border-radius: 999px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.6rem; }
    p { margin: 0 0 1rem; color: var(--muted); font-size: 0.98rem; }
    a { color: var(--accent-dark); }
    .dot { display: inline-block; width: 0.5em; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60% { opacity: 0.15; } 30% { opacity: 1; } }
    footer { margin-top: 1.5rem; font-size: 0.78rem; color: var(--muted); opacity: 0.8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Anki<span class="t">Tov</span></div>
    <div class="badge">Coming soon</div>
    <h1>Something is taking shape here.</h1>
    <p>AnkiTov is an open, self-hosted spaced repetition system for schools.</p>
    <p>Nearly no burden on teaching staff. No extra class time.</p>
    <p>Questions? <a href="mailto:hello@ankitov.org">hello@ankitov.org</a></p>
    <footer>No cookies &bull; No trackers &bull; No telemetry</footer>
  </main>
</body>
</html>
